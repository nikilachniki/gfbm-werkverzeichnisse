name: Daten prüfen

# Prueft jeden Pull Request, bevor er nach main kommt: Schema, IDs, Verweise und
# RDF mit validate.py, dazu den MeLODy-Export. Der Baukasten in lassoDB zeigt das
# Ergebnis an und laesst erst nach gruener Pruefung zusammenfuehren.
#
# Nach jedem Push auf main stoesst der zweite Job den Neubau der Website an. Dafuer
# braucht das Repo das Secret LASSODB_DEPLOY_TOKEN: ein fein granularer Token fuer
# nikilachniki/lassoDB mit dem Recht Actions (lesen und schreiben). Fehlt es, wird
# der Schritt uebersprungen.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Abhaengigkeiten installieren
        run: pip install -r scripts/requirements.txt

      - name: Alle Datenordner pruefen
        run: |
          status=0
          for folder in data examples/*/; do
            folder="${folder%/}"
            echo "::group::$folder"
            python scripts/validate.py "$folder" || status=1
            python scripts/export_melody.py --data "$folder" --out "$RUNNER_TEMP/export-$(basename "$folder")" || status=1
            echo "::endgroup::"
          done
          exit $status

  website:
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Neubau der Website anstossen
        env:
          TOKEN: ${{ secrets.LASSODB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Kein LASSODB_DEPLOY_TOKEN eingerichtet, die Website wird nicht neu gebaut."
            exit 0
          fi
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nikilachniki/lassoDB/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
