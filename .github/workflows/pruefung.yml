name: Daten prüfen (gemeinsam)

# Wiederverwendbarer Workflow: prueft die Daten eines Repos mit Schema, Kontext und
# Skripten aus dieser Vorlage. So gilt eine Aenderung am Datenmodell sofort fuer alle
# Werkverzeichnisse, und niemand muss seine Kopie nachziehen. Aufruf siehe pruefen.yml.
on:
  workflow_call:
    inputs:
      folders:
        description: Zu pruefende Datenordner, Platzhalter erlaubt
        type: string
        default: data
      vorlage-ref:
        description: Stand von Schema und Skripten (Branch, Tag oder Commit dieser Vorlage)
        type: string
        default: main

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Daten auschecken
        uses: actions/checkout@v4
        with:
          path: daten

      - name: Vorlage auschecken
        uses: actions/checkout@v4
        with:
          repository: nikilachniki/gfbm-werkverzeichnisse
          ref: ${{ inputs.vorlage-ref }}
          path: vorlage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vorlage/scripts/requirements.txt

      - name: Abhaengigkeiten installieren
        run: pip install -r vorlage/scripts/requirements.txt

      - name: Datenordner pruefen
        working-directory: daten
        env:
          FOLDERS: ${{ inputs.folders }}
        run: |
          status=0
          for folder in $FOLDERS; do
            folder="${folder%/}"
            [ -f "$folder/catalog.json" ] || continue
            echo "::group::$folder"
            python ../vorlage/scripts/validate.py "$folder" || status=1
            python ../vorlage/scripts/export_melody.py --data "$folder" --out "$RUNNER_TEMP/export-$(basename "$folder")" || status=1
            echo "::endgroup::"
          done
          exit $status
